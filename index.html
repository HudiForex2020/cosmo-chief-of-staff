<!DOCTYPE html>
<html lang="id">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>COSMO</title>

<style>
body{
font-family:Arial,sans-serif;
max-width:900px;
margin:40px auto;
padding:20px;
}

input{
width:70%;
padding:10px;
}

button{
padding:10px;
cursor:pointer;
}

#response{
margin-top:20px;
padding:15px;
border:1px solid #ddd;
border-radius:8px;
}
</style>

</head>

<body>

<h1>COSMO™</h1>
<h2>Chief Operating Staff & Management Orchestrator</h2>

<input
id="question"
type="text"
placeholder="Tanya COSMO..." />

<button onclick="askCosmo()">
Send
</button>

<div id="response">
COSMO siap menerima pertanyaan.
</div>

<script>

async function askCosmo(){

const q =
document
.getElementById("question")
.value
.toLowerCase();

let answer =
"Saya belum memahami pertanyaan tersebut.";

if(q.includes("proyek")){

answer =
"Proyek aktif saat ini:<br><br>" +
"• COSMO<br>" +
"• ShortPro<br>" +
"• ARTHOKU";

}

else if(q.includes("tujuan")){

answer =
"Tujuan utama Anda adalah memenangkan Best Agent Week 12 dan membangun COSMO sebagai AI Chief of Staff.";

}

else if(q.includes("visi")){

answer =
"Visi COSMO adalah membangun One Person Company yang dijalankan oleh satu manusia dan AI Workforce.";

}

document
.getElementById("response")
.innerHTML =
"<b>COSMO:</b><br><br>" +
answer;

}

</script>

</body>

</html>
