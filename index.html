<!DOCTYPE html>
<html lang="id">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>COSMO</title>

<style>
body{
font-family:Arial,sans-serif;
max-width:900px;
margin:40px auto;
padding:20px;
}

input{
width:70%;
padding:10px;
}

button{
padding:10px;
cursor:pointer;
}

#response{
margin-top:20px;
padding:15px;
border:1px solid #ddd;
border-radius:8px;
}
</style>

</head>

<body>

<h1>COSMO™</h1>
<h2>Chief Operating Staff & Management Orchestrator</h2>

<input
id="question"
type="text"
placeholder="Tanya COSMO..." />

<button onclick="askCosmo()">
Send
</button>

<div id="response">
COSMO siap menerima pertanyaan.
</div>

<script>

async function askCosmo() {

    const q =
        document
            .getElementById("question")
            .value
            .toLowerCase();

    let answer =
        `
        <b>INFORMASI</b><br>
        Saya belum memahami pertanyaan tersebut.<br><br>

        <b>REKOMENDASI</b><br>
        Gunakan pertanyaan yang tersedia.<br><br>

        <b>NEXT ACTION</b><br>
        Tanyakan tentang proyek, tujuan, keputusan, atau visi COSMO.
        `;

    if (q.includes("proyek")) {

        answer =
        `
        <b>INFORMASI</b><br>

        Proyek aktif saat ini:<br>
        • COSMO<br>
        • ShortPro<br>
        • ARTHOKU<br><br>

        <b>REKOMENDASI</b><br>

        Fokus utama minggu ini adalah COSMO karena menjadi fondasi seluruh roadmap hingga Week 12.<br><br>

        <b>NEXT ACTION</b><br>

        Lanjutkan pembangunan Memory Retrieval Engine.
        `;
    }

    else if (q.includes("tujuan")) {

        answer =
        `
        <b>INFORMASI</b><br>

        Tujuan utama saat ini:<br>
        • Menang Best Agent Week 12<br>
        • Membangun COSMO sebagai AI Chief of Staff<br>
        • Membangun One Person Company berbasis AI Workforce<br><br>

        <b>REKOMENDASI</b><br>

        Prioritaskan pengembangan Memory Brain sebelum menambah fitur baru.<br><br>

        <b>NEXT ACTION</b><br>

        Selesaikan integrasi Supabase Retrieval.
        `;
    }

    else if (q.includes("keputusan")) {

        answer =
        `
        <b>INFORMASI</b><br>

        Keputusan penting yang telah dibuat:<br>
        • Nama Chief of Staff adalah COSMO<br>
        • Menggunakan Human-In-The-Loop<br>
        • Menggunakan arsitektur One Person Company<br><br>

        <b>REKOMENDASI</b><br>

        Pertahankan fokus pada visi AI Workforce hingga Week 12.<br><br>

        <b>NEXT ACTION</b><br>

        Bangun Executive Dashboard dan Memory Retrieval.
        `;
    }

    else if (q.includes("visi")) {

        answer =
        `
        <b>INFORMASI</b><br>

        Visi COSMO adalah membangun One Person Company yang dijalankan oleh satu manusia dan AI Workforce.<br><br>

        <b>REKOMENDASI</b><br>

        Fokus pada otomatisasi pekerjaan rutin dan penguatan Memory Brain.<br><br>

        <b>NEXT ACTION</b><br>

        Integrasikan seluruh agent ke dalam satu dashboard COSMO.
        `;
    }

    document
        .getElementById("response")
        .innerHTML =
        "<b>COSMO:</b><br><br>" +
        answer;
}

else if(q.includes("tujuan")){

answer =
"Tujuan utama Anda adalah memenangkan Best Agent Week 12 dan membangun COSMO sebagai AI Chief of Staff.";

}

else if(q.includes("visi")){

answer =
"Visi COSMO adalah membangun One Person Company yang dijalankan oleh satu manusia dan AI Workforce.";

}

document
    .getElementById("response")
    .innerHTML =
    "<b>COSMO:</b><br><br>" +
    answer;

document
    .getElementById("question")
    .value = "";

document
    .getElementById("question")
    .focus();

}

</script>

</body>

</html>
