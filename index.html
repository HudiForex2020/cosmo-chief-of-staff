<!DOCTYPE html>
<html>
  <script src="https://cdn.jsdelivr.net/npm/@base-js@2script>
<head>
  <title>COSMO</title>
</head>
<body>

<h1>COSMO™</h1>
<h2>Chief Operating Staff & Management Orchestrator</h2>

<input id="question" type="text" placeholder="Tanya COSMO..." />
<button onclick="askCosmo()">Send</button>

<div id="response"></div>

const SUPABASE_URL =
"https://rxtggmcfmbbvpjcrgrbg.supabase.co";

const SUPABASE_KEY =
"sb_publishable_0pbZL9hkQPpyRJ9i9mnsDg_kQY5N6CL";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

  
<script>
async function askCosmo() {

  const q =
    document
      .getElementById("question")
      .value
      .toLowerCase();

  let answer =
    "Saya belum memahami pertanyaan tersebut.";

  if(q.includes("proyek")) {

    const { data } =
      await supabaseClient
      .from("projects")
      .select("*");

    answer =
      "Proyek aktif saat ini:<br><br>";

    data.forEach(project => {

      answer +=
        "- " +
        project.name +
        "<br>";

    });

  }

  document.getElementById("response")
    .innerHTML =
    "<br><b>COSMO:</b><br>" +
    answer;
}
</script>

</body>
</html>
